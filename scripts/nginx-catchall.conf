# Unknown Host headers (stale DNS pointing at this IP) must not
# receive purplebean.coffee or esl_go. www.magna.cl is one such name.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    default_type text/plain;
    return 404 "Not found\n";
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/purplebean.coffee/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/purplebean.coffee/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    default_type text/plain;
    return 404 "Not found\n";
}
